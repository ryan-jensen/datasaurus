[project]
name = "datasaurus"
version = "0.2.0.0"
description = "Python port of the datasaurus project - generating point clouds that match statistics"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Ryan Jensen", email = "jensenrj@sfasu.edu"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
datasaurus = "datasaurus.main:main"

[project.urls]
Homepage = "https://github.com/ryan-jensen/datasaurus"
Documentation = "https://github.com/ryan-jensen/datasaurus#readme"
Repository = "https://github.com/ryan-jensen/datasaurus"
Issues = "https://github.com/ryan-jensen/datasaurus/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datasaurus"]

[tool.hatch.build.targets.sdist]
packages = ["src/datasaurus"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
